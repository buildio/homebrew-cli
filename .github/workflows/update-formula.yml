name: Update Homebrew Formula

on:
  repository_dispatch:
    types: [cli-released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'CLI release tag (e.g. v1.2.0)'
        required: true
        type: string

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "value=${{ github.event.client_payload.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release artifacts and compute sha256
        id: sha
        run: |
          set -euo pipefail

          TAG="${{ steps.tag.outputs.value }}"
          SOURCE_URL="https://github.com/buildio/cli/archive/refs/tags/${TAG}.tar.gz"
          DARWIN_AMD64_URL="https://github.com/buildio/cli/releases/download/${TAG}/bld-darwin-amd64.zip"

          download_with_retry() {
            local url="$1"
            local output="$2"

            for attempt in $(seq 1 30); do
              if curl -fsSL "$url" -o "$output"; then
                return 0
              fi

              echo "Waiting for $url ($attempt/30)"
              sleep 20
            done

            curl -fSL "$url" -o "$output"
          }

          download_with_retry "$SOURCE_URL" release.tar.gz
          download_with_retry "$DARWIN_AMD64_URL" bld-darwin-amd64.zip

          SOURCE_SHA=$(sha256sum release.tar.gz | awk '{print $1}')
          DARWIN_AMD64_SHA=$(sha256sum bld-darwin-amd64.zip | awk '{print $1}')

          {
            echo "source_sha=$SOURCE_SHA"
            echo "source_url=$SOURCE_URL"
            echo "darwin_amd64_sha=$DARWIN_AMD64_SHA"
            echo "darwin_amd64_url=$DARWIN_AMD64_URL"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Update formula
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Formula/b/bld.rb")
          text = path.read_text()

          source_replacements = [
              (
                  r'(^  url ")[^"]+(")',
                  rf'\g<1>{os.environ["SOURCE_URL"]}\2',
                  1,
              ),
              (
                  r'(^  sha256 ")[^"]+(")',
                  rf'\g<1>{os.environ["SOURCE_SHA"]}\2',
                  1,
              ),
          ]

          for pattern, replacement, count in source_replacements:
              text, changed = re.subn(pattern, replacement, text, count=count, flags=re.MULTILINE)
              if changed != count:
                  raise SystemExit(f"Expected {count} replacement for {pattern}, got {changed}")

          resource_block = (
              '  resource "darwin-amd64" do\n'
              f'    url "{os.environ["DARWIN_AMD64_URL"]}"\n'
              f'    sha256 "{os.environ["DARWIN_AMD64_SHA"]}"\n'
              '  end\n'
              '\n'
          )

          if 'resource "darwin-amd64"' in text:
              resource_replacements = [
                  (
                      r'(^    url ")[^"]+(")',
                      rf'\g<1>{os.environ["DARWIN_AMD64_URL"]}\2',
                      1,
                  ),
                  (
                      r'(^    sha256 ")[^"]+(")',
                      rf'\g<1>{os.environ["DARWIN_AMD64_SHA"]}\2',
                      1,
                  ),
              ]

              for pattern, replacement, count in resource_replacements:
                  text, changed = re.subn(pattern, replacement, text, count=count, flags=re.MULTILINE)
                  if changed != count:
                      raise SystemExit(f"Expected {count} replacement for {pattern}, got {changed}")
          else:
              needle = '  if !OS.mac? || !Hardware::CPU.intel? || version < Version.new(DARWIN_AMD64_BINARY_MIN_VERSION)\n'
              if needle not in text:
                  raise SystemExit("Formula is missing the Darwin AMD64 dependency guard")
              text = text.replace(needle, resource_block + needle, 1)

          path.write_text(text)
          PY
        env:
          SOURCE_URL: ${{ steps.sha.outputs.source_url }}
          SOURCE_SHA: ${{ steps.sha.outputs.source_sha }}
          DARWIN_AMD64_URL: ${{ steps.sha.outputs.darwin_amd64_url }}
          DARWIN_AMD64_SHA: ${{ steps.sha.outputs.darwin_amd64_sha }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/b/bld.rb
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update bld to ${{ steps.sha.outputs.version }}"
            git push
          fi
